name: Stablecore
description: 'Stablecore provides digital-asset banking infrastructure that lets banks
  and credit unions offer stablecoins, tokenized deposits, digital-asset accounts and
  exchange, and digital-asset-based lending inside their existing core, digital-banking
  and compliance stacks. The platform targets cross-border payments, treasury management,
  digital-asset investing, crypto on/off-ramps and stablecoin sponsor banking, with
  a multi-provider design intended to avoid vendor lock-in and built-in compliance
  tooling. Stablecore is SOC 2 compliant and an ABA Partner Network member; investors
  include Coinbase Ventures, Norwest Venture Partners and Bank of Utah. As of this
  enrichment pass the company publishes a marketing and product site plus a blog, but
  no public developer portal, API documentation, OpenAPI, SDKs or GitHub organization.'
